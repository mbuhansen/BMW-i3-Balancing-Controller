; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo_t2can]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_flags = 
	-DLILYGO_T2CAN
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	; T-2CAN Pin Configuration (ESP32-S3 based)
	-DCAN_TX_PIN=7
	-DCAN_RX_PIN=6
	-DMCP2515_SCK=12
	-DMCP2515_MOSI=11
	-DMCP2515_MISO=13
	-DMCP2515_CS=10
	-DMCP2515_INT=8
	-DMCP2515_RST=9
lib_deps = 
	https://github.com/mathieucarbou/ESPAsyncWebServer#v3.6.0
	https://github.com/mathieucarbou/AsyncTCP#v3.2.14
	bblanchon/ArduinoJson@^7.4.2
	mbed-neilt6/LM75B@0.0.0+sha.7ac462ba84ac
	pierremolinaro/ACAN2515@^2.1.5
monitor_speed = 115200
monitor_filters = 
	esp32_exception_decoder
	colorize
	default
upload_speed = 921600