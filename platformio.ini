[env:lilygo_tcan485]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; LilyGO T-CAN485 specific settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLILYGO_TCAN485
    -DCORE_DEBUG_LEVEL=3

lib_deps = 
    https://github.com/pierremolinaro/acan2515.git
    ESP Async WebServer
    AsyncTCP
    ArduinoJson

monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    colorize
    default

upload_speed = 921600
